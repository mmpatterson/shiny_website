# _brand.yml
color:
  palette:
    cream: "#FAFAF7"
    navy: "#00295B" # Navy: for buttons, links, headers
    bluegray: "#4C6A92"     # Desaturated blue-gray
    steelblue: "#C3CEDA"        # Soft steel blue (highlight areas, subtle UI)
    code-text: "#00274D" # Navy
    code-background: "#F3F3F3"
    secondary: "#707073"
    tertiary: "#C2C2C4"

  foreground: navy
  background: cream
  primary: navy
  secondary: secondary
  tertiary: tertiary
  success: "#72994E"
  info: "#419599"
  warning: "#EE6331"
  danger: "#9A4665"
  light: "#00274D"
  dark: "#404041"

  
typography:
  headings:
    color: primary
  monospace-inline:
    color: background
    background-color: code-background
  monospace-block:
    color: background
    background-color: code-background
  link:
    color: danger